rules:
  dangerous-triggers:
    ignore:
      - mkdocs-check-broken-links.yml
      - pr_labeler.yaml
      # pull_request_target is deliberate: the review runs main's copy of the workflow
      # and never checks out PR code (see the comment in the workflow).
      - claude-code-review.yml
      # issue_comment is how @claude is invoked. claude-code-action only runs for
      # commenters with write access, the API key comes from the main-only openai1
      # environment, and the PR's .claude/ and .mcp.json are removed before Claude runs.
      - claude.yml
  dependabot-cooldown:
    ignore:
      - dependabot.yml
  secrets-outside-env:
    ignore:
      - contrib-test.yml
      - contrib-graph-rag-tests.yml
      - contrib-llm-test.yml
      - core-llm-test.yml
      - core-test.yml
      - integration-test.yml
      - pr-checks.yml
      - test-with-optional-deps.yml
      - zizmor.yml
  artipacked:
    ignore:
      - build-mkdocs.yml
  use-trusted-publishing:
    ignore:
      - python-package.yml
      - cli-package.yml
